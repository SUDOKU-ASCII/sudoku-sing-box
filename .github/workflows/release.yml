name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TAGS: with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,badlinkname,tfogo_checklinkname0

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
    steps:
      - name: Set outputs
        id: outputs
        run: |-
          set -euo pipefail
          ref="${{ github.ref_name }}"
          if [[ "${ref}" != v* ]]; then
            echo "Unexpected tag: ${ref}" >&2
            exit 1
          fi
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

  build_binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    needs:
      - calculate_version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: freebsd, arch: amd64 }
          - { os: windows, arch: amd64 }
          - { os: android, arch: arm64, ndk: "aarch64-linux-android23" }
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Setup Android NDK
        if: matrix.os == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          local-cache: true
      - name: Build
        run: |-
          set -xeuo pipefail
          mkdir -p dist
          BUILD_TAGS_CURRENT="${BUILD_TAGS}"
          if [[ "${{ matrix.os }}" == "freebsd" ]]; then
            # sagernet/tailscale v1.92.4-sing-box-1.13-mod.6 has a broken
            # freebsd-only file (unused wireguard-go/tun import), so exclude
            # tailscale from this target until that dependency is fixed.
            BUILD_TAGS_CURRENT="${BUILD_TAGS_CURRENT/,with_tailscale/}"
            BUILD_TAGS_CURRENT="${BUILD_TAGS_CURRENT/with_tailscale,/}"
            BUILD_TAGS_CURRENT="${BUILD_TAGS_CURRENT/with_tailscale/}"
          fi
          if [[ "${{ matrix.os }}" == "android" ]]; then
            go install -v ./cmd/internal/build
            export CC='${{ matrix.ndk }}-clang'
            export CXX="${CC}++"
            CGO_ENABLED=1 BUILD_GOOS=android BUILD_GOARCH=${{ matrix.arch }} GOOS=android GOARCH=${{ matrix.arch }} build go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS_CURRENT}" \
              -ldflags '-s -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0' \
              ./cmd/sing-box
          else
            CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS_CURRENT}" \
              -ldflags '-s -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0' \
              ./cmd/sing-box
          fi
      - name: Archive
        run: |-
          set -xeuo pipefail
          cd dist
          DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}"
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            mv sing-box "${DIR_NAME}/sing-box.exe"
            zip -r "${DIR_NAME}.zip" "${DIR_NAME}"
          else
            mv sing-box "${DIR_NAME}/sing-box"
            tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          fi
          rm -r "${DIR_NAME}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}_${{ matrix.arch }}
          path: dist
          if-no-files-found: error

  build_darwin:
    name: Build darwin binaries
    runs-on: macos-latest
    needs:
      - calculate_version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64 }
          - { arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |-
          set -xeuo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=darwin GOARCH=${{ matrix.arch }} go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
            -ldflags '-s -buildid= -X github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0' \
            ./cmd/sing-box
      - name: Archive
        run: |-
          set -xeuo pipefail
          cd dist
          DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-darwin-${{ matrix.arch }}"
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}"
          mv sing-box "${DIR_NAME}/sing-box"
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -r "${DIR_NAME}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin_${{ matrix.arch }}
          path: dist
          if-no-files-found: error

  upload:
    name: Upload builds
    if: always()
    runs-on: ubuntu-latest
    needs:
      - calculate_version
      - build_binaries
      - build_darwin
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Cache ghr
        uses: actions/cache@v4
        id: cache-ghr
        with:
          path: |
            ~/go/bin/ghr
          key: ghr
      - name: Setup ghr
        if: steps.cache-ghr.outputs.cache-hit != 'true'
        run: |-
          cd $HOME
          git clone https://github.com/nekohasekai/ghr ghr
          cd ghr
          go install -v .
      - name: Download builds
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Upload builds
        run: |-
          set -xeuo pipefail
          export PATH="$PATH:$HOME/go/bin"
          VERSION="${{ needs.calculate_version.outputs.version }}"
          ghr --replace --draft --prerelease -p 5 "v${VERSION}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
